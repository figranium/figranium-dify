name: Dify Marketplace Preflight

on:
  push:
    paths:
      - .github/workflows/marketplace-preflight-temp.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Clone Dify marketplace toolkit
        run: gh repo clone langgenius/dify-marketplace-toolkit -- .scripts
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install plugin dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python3 -m pip install -r requirements.txt
          pip install packaging
          dify_version=$(pip list | grep -oE 'dify[-_]plugin[[:space:]]+[0-9][0-9.a-zA-Z]*' | awk '{print $2}')
          target_version='0.0.1b64'
          if python -c "from packaging.version import Version; exit(0 if Version('$dify_version') > Version('$target_version') else 1)"; then
            echo 'INSTALL_METHOD=serverless' >> "$GITHUB_ENV"
            echo 'SERVERLESS_PORT=8080' >> "$GITHUB_ENV"
            echo 'SERVERLESS_HOST=0.0.0.0' >> "$GITHUB_ENV"
          else
            echo 'INSTALL_METHOD=aws_lambda' >> "$GITHUB_ENV"
            echo 'AWS_LAMBDA_PORT=8080' >> "$GITHUB_ENV"
            echo 'AWS_LAMBDA_HOST=0.0.0.0' >> "$GITHUB_ENV"
          fi

      - name: Run Dify installation test
        run: |
          source .venv/bin/activate
          timeout 300 python3 .scripts/validator/test-plugin-install.py -d .

      - name: Download Dify plugin daemon
        run: |
          gh release download -R langgenius/dify-plugin-daemon --pattern 'dify-plugin-linux-amd64' --dir /tmp
          chmod +x /tmp/dify-plugin-linux-amd64
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Repackage with marketplace daemon
        run: /tmp/dify-plugin-linux-amd64 plugin package . --output_path /tmp/figranium-preflight.difypkg