identity:
  name: execute_task
  author: figranium
  label:
    en_US: Execute Task
description:
  human:
    en_US: Run a saved Figranium browser automation task and return its result. Choose a task and, when needed, provide JSON variable overrides.
  llm: Run a saved Figranium browser automation task. Choose one of the tasks returned by the connected Figranium server. variables_json is optional and must be a JSON object of string key/value overrides, for example {"url":"https://example.com","limit":"10"}. Return the Figranium result exactly as provided.
parameters:
  - name: task_id
    type: dynamic-select
    required: true
    label:
      en_US: Task
    placeholder:
      en_US: Select a Figranium task
    human_description:
      en_US: Choose a saved task from the connected Figranium server.
    llm_description: Select the saved Figranium automation task to execute from the available task list.
    form: llm
  - name: variables_json
    type: string
    required: false
    label:
      en_US: Variable overrides (JSON)
    placeholder:
      en_US: '{"url":"https://example.com","limit":"10"}'
    human_description:
      en_US: Optional JSON object of runtime variable overrides. Values must be strings.
    llm_description: Optional JSON object of runtime variable overrides. Use only string values, e.g. {"url":"https://example.com","limit":"10"}. Omit when no overrides are needed.
    form: llm
extra:
  python:
    source: tools/execute_task.py
