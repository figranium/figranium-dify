[project]
name = "figranium-dify"
version = "0.0.1"
description = "Official Figranium Tool Plugin for Dify"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dify-plugin>=0.10.2,<0.11.0",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<9.2.0",
  "ruff>=0.17.2,<0.18.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
